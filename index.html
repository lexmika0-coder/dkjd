<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Access Portal</title>
    <style>
      :root {
        --page-bg: #f1f3f5;
        --brand-bg: #070d13;
        --brand-stroke: #1ed8ff;
        --brand-soft: rgba(30, 216, 255, 0.62);
        --panel-bg: rgba(255, 255, 255, 0.9);
        --panel-border: rgba(16, 24, 40, 0.08);
        --panel-shadow: rgba(22, 32, 44, 0.12);
        --text: #0d1726;
        --muted: #53657a;
        --field-border: rgba(16, 24, 40, 0.18);
        --field-focus: rgba(30, 216, 255, 0.7);
        --button-bg: #0d1b2a;
        --button-hover: #13273d;
        --button-text: #ffffff;
        --success-bg: rgba(19, 188, 120, 0.12);
        --success-border: rgba(19, 188, 120, 0.35);
        --success-text: #0f6a44;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--page-bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .page {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(30, 216, 255, 0.08), transparent 26%),
          var(--page-bg);
        overflow: hidden;
      }

      .logo-wrap {
        position: absolute;
        left: 24px;
        top: 18px;
        width: 178px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--brand-bg);
        border-radius: 2px;
        box-shadow: 0 0 0 1px rgba(30, 216, 255, 0.38);
      }

      .logo {
        position: relative;
        width: 144px;
        height: 84px;
      }

      .logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .logo path,
      .logo line {
        fill: none;
        stroke: var(--brand-stroke);
        stroke-width: 4.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 5px rgba(30, 216, 255, 0.9));
      }

      .logo .soft {
        stroke: var(--brand-soft);
      }

      .login-panel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 420px);
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: 0 14px 34px var(--panel-shadow);
        padding: 28px 24px 22px;
        backdrop-filter: blur(6px);
      }

      .login-title {
        margin: 0 0 18px;
        font-size: clamp(1.7rem, 3vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.05em;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      .field label {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text);
      }

      .field input {
        width: 100%;
        height: 48px;
        border: 1px solid var(--field-border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.85);
        color: var(--text);
        padding: 0 14px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      }

      .field input::placeholder {
        color: rgba(13, 23, 38, 0.45);
      }

      .field input:focus {
        border-color: var(--field-focus);
        box-shadow: 0 0 0 3px rgba(30, 216, 255, 0.18);
      }

      .actions {
        margin-top: 10px;
      }

      .submit-btn {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 10px;
        background: var(--button-bg);
        color: var(--button-text);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.18s ease, transform 0.15s ease, opacity 0.18s ease;
      }

      .submit-btn:hover {
        background: var(--button-hover);
      }

      .submit-btn:active {
        transform: translateY(1px);
      }

      .status {
        display: none;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--success-border);
        background: var(--success-bg);
        color: var(--success-text);
        font-size: 0.92rem;
        font-weight: 600;
      }

      .status.visible {
        display: block;
      }

      @media (max-width: 640px) {
        .logo-wrap {
          left: 18px;
          top: 12px;
          width: 146px;
          height: 90px;
        }

        .login-panel {
          padding: 22px 18px 18px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="logo-wrap" aria-label="Brand logo">
        <div class="logo">
          <svg viewBox="0 0 180 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon dual-arrow logo">
            <path class="soft" d="M 14 18 L 68 55 L 14 92" />
            <path d="M 14 18 L 68 55 L 14 92" />

            <path class="soft" d="M 100 18 L 154 55 L 100 92" />
            <path d="M 100 18 L 154 55 L 100 92" />

            <line class="soft" x1="72" y1="22" x2="72" y2="88" />
            <line x1="72" y1="22" x2="72" y2="88" />
          </svg>
        </div>
      </div>

      <form class="login-panel" id="loginForm" aria-label="Sign in form">
        <h1 class="login-title">Sign in</h1>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" />
        </div>

        <div class="actions">
          <button class="submit-btn" type="submit">Continue</button>
        </div>

        <div class="status" id="statusMessage" aria-live="polite">
          You have successfully signed in.
        </div>
      </form>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const status = document.getElementById('statusMessage');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
          status.textContent = 'Please enter both username and password.';
          status.classList.add('visible');
          return;
        }

        status.textContent = 'Welcome back, ' + username + '. Your session is ready.';
        status.classList.add('visible');
      });
    </script>
  </body>
</html>
