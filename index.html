<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Page</title>
    <style>
      :root {
        --page-bg: #f0f0f0;
        --icon-bg: #000000;
        --icon-stroke: #1ed8ff;
        --icon-glow: rgba(30, 216, 255, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--page-bg);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      .page {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background: var(--page-bg);
      }

      .logo-wrap {
        position: absolute;
        left: 20px;
        top: 16px;
        width: 180px;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--icon-bg);
        border-radius: 2px;
        box-shadow: 0 0 0 1px rgba(30, 216, 255, 0.35);
      }

      .logo {
        position: relative;
        width: 140px;
        height: 82px;
      }

      .logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .logo path,
      .logo line {
        fill: none;
        stroke: var(--icon-stroke);
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 5px var(--icon-glow));
      }

      .logo .soft {
        stroke: rgba(30, 216, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="logo-wrap" aria-label="Brand logo">
        <div class="logo">
          <svg viewBox="0 0 180 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon dual-arrow logo">
            <path class="soft" d="M 14 18 L 68 55 L 14 92" />
            <path d="M 14 18 L 68 55 L 14 92" />

            <path class="soft" d="M 100 18 L 154 55 L 100 92" />
            <path d="M 100 18 L 154 55 L 100 92" />

            <line class="soft" x1="72" y1="22" x2="72" y2="88" />
            <line x1="72" y1="22" x2="72" y2="88" />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
